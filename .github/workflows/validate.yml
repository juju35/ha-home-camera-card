name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by Release, so that a version is published only once these checks pass.
  workflow_call:

permissions:
  contents: read

# github.workflow is "Release" when called from Release: the group then stays distinct from this
# workflow's own push run on main, so neither cancels the other.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The checks the release makes, before merging: a version bumped in one file only fails the release on main.
      - name: Same version everywhere, and in the changelog
        run: |
          VERSION="$(jq -r .version custom_components/home_camera/manifest.json)"
          grep -q "VERSION = \"$VERSION\"" custom_components/home_camera/const.py || { echo "::error file=custom_components/home_camera/const.py::version $VERSION not found in const.py"; exit 1; }
          grep -q "HOME_CAMERA_CARD_VERSION = '$VERSION'" custom_components/home_camera/frontend/home-camera-card.js || { echo "::error file=custom_components/home_camera/frontend/home-camera-card.js::version $VERSION not found in the card"; exit 1; }
          grep -q "HOME_CAMERA_PANEL_VERSION = '$VERSION'" custom_components/home_camera/frontend/home-camera-panel.js || { echo "::error file=custom_components/home_camera/frontend/home-camera-panel.js::version $VERSION not found in the panel"; exit 1; }
          grep -q "\"version\": \"$VERSION\"" package.json || { echo "::error file=package.json::version $VERSION not found in package.json"; exit 1; }
          test "$(node -p "require('./package-lock.json').version")" = "$VERSION" || { echo "::error file=package-lock.json::package-lock.json is not at $VERSION (npm install)"; exit 1; }
          grep -q "^## $VERSION " CHANGELOG.md || { echo "::error file=CHANGELOG.md::no '## $VERSION' entry in CHANGELOG.md"; exit 1; }
          echo "Version $VERSION everywhere"

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Latest Home Assistant: releases since 2026.3 need Python 3.14 (3.13 would resolve to 2026.2).
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: Home Assistant version
        run: python -c 'from homeassistant.const import __version__; print(f"::notice::Home Assistant {__version__}")'

      - name: Run tests
        run: pytest
        env:
          DEPRECATIONS_LOG: ${{ runner.temp }}/deprecations.log

      - name: Annotate deprecated calls
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/deprecations.log" ]; then
            sort -u "$RUNNER_TEMP/deprecations.log" | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done
          fi

  build:
    name: Build & check
    runs-on: ubuntu-latest
    # Debian 12 container (Node 22 included): apt goes to the Debian mirrors, not the runner's Ubuntu ones,
    # which kept failing. The job runs as root, hence no sudo below.
    container: node:22-bookworm
    # In a container, run steps default to sh (dash, no pipefail): keep bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The workspace is owned by another user than the container's root: let git work in it.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      - name: Build and check the card and the panel
        run: npm run check

      - name: Unit tests
        run: npm test

      # The browser download (no apt) is kept apart from its system libraries, so the apt work all
      # sits in one time-boxed, retried step and a hung mirror cannot stall the job.
      - name: Install Chromium for the browser tests
        run: npx playwright install chromium

      - name: Install Chromium system deps and zip
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            timeout 150 apt-get update \
              && timeout 300 env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zip unzip \
              && timeout 300 npx playwright install-deps chromium \
              && ok=1 && break
            echo "apt attempt $i failed or timed out, retrying in 15s"; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::apt failed 3 times"; exit 1; }

      - name: Browser tests
        run: npm run test:browser

      - name: The release zip carries the integration
        run: |
          node scripts/build.mjs --into
          (cd custom_components/home_camera && zip -qr ../../home_camera.zip . -x "__pycache__/*")
          # Listed once into a file: with pipefail, `unzip -l | grep -q` fails (SIGPIPE) as soon as grep has its match.
          unzip -Z1 home_camera.zip > "$RUNNER_TEMP/zip.list"
          grep -qx "manifest.json" "$RUNNER_TEMP/zip.list"
          grep -qx "frontend/home-camera-panel.js" "$RUNNER_TEMP/zip.list"
          grep -qx "frontend/home-camera-card.i18n.fr.js" "$RUNNER_TEMP/zip.list"
